<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ t.brand }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">{{ t.brand }}</div>

      <nav class="nav">
        <a href="/?league=bundesliga&lang={{ lang }}" class="{% if league == 'bundesliga' %}active{% endif %}">{{ t.nav.bundesliga }}</a>
        <a href="/?league=premierleague&lang={{ lang }}" class="{% if league == 'premierleague' %}active{% endif %}">{{ t.nav.premierleague }}</a>
        <a href="/?league=seriea&lang={{ lang }}" class="{% if league == 'seriea' %}active{% endif %}">{{ t.nav.seriea }}</a>
        <a href="/?league=ligue1&lang={{ lang }}" class="{% if league == 'ligue1' %}active{% endif %}">{{ t.nav.ligue1 }}</a>
        <a href="/?league=championsleague&lang={{ lang }}" class="{% if league == 'championsleague' %}active{% endif %}">{{ t.nav.championsleague }}</a>
        <a href="/?league=euro&lang={{ lang }}" class="{% if league == 'euro' %}active{% endif %}">{{ t.nav.euro }}</a>
        <a href="/?league=worldcup&lang={{ lang }}" class="{% if league == 'worldcup' %}active{% endif %}">{{ t.nav.worldcup }}</a>
      </nav>

      <div class="top-actions">
        <div class="lang-switch">
          <a href="?league={{ league }}&lang=de" class="{% if lang == 'de' %}active{% endif %}">DE</a>
          <a href="?league={{ league }}&lang=en" class="{% if lang == 'en' %}active{% endif %}">EN</a>
          <a href="?league={{ league }}&lang=it" class="{% if lang == 'it' %}active{% endif %}">IT</a>
          <a href="?league={{ league }}&lang=fr" class="{% if lang == 'fr' %}active{% endif %}">FR</a>
        </div>
        <a class="btn-login" href="/login?league={{ league }}&lang={{ lang }}">{{ t.login }}</a>
      </div>
    </div>
  </header>

  {% block content %}{% endblock %}
</body>
</html>
