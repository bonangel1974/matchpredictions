{% extends "base.html" %}

{% block content %}
<main class="container auth-page">
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-badge">{{ t.forgot_password }}</div>
      <h1>{{ t.forgot_title }}</h1>
      <p>{{ t.forgot_text }}</p>

      <form class="auth-form">
        <label>{{ t.email }}</label>
        <input type="email" placeholder="name@example.com">
        <button type="submit" class="auth-btn">{{ t.forgot_button }}</button>
      </form>

      <div class="auth-bottom">
        <a href="/login?league={{ league }}&lang={{ lang }}">{{ t.back_to_login }}</a>
      </div>
    </div>
  </div>
</main>
{% endblock %}
